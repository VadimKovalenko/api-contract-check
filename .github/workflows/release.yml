name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build release artifact
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build client
        run: npm run build

      - name: Package runtime files
        run: |
          mkdir -p release-package
          cp -R dist dist-server package.json package-lock.json release-package/
          tar -czf "api-contract-check-${GITHUB_REF_NAME}.tar.gz" -C release-package .

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: api-contract-check-${{ github.ref_name }}
          path: api-contract-check-${{ github.ref_name }}.tar.gz
          if-no-files-found: error
          overwrite: true

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          artifact="api-contract-check-${GITHUB_REF_NAME}.tar.gz"

          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" "${artifact}" --clobber
          else
            gh release create "${GITHUB_REF_NAME}" "${artifact}" \
              --title "${GITHUB_REF_NAME}" \
              --generate-notes
          fi

  deploy-lightsail:
    name: Deploy to Lightsail
    runs-on: ubuntu-latest
    needs: build
    if: ${{ vars.LIGHTSAIL_HOST != '' }}
    environment: production

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download release artifact
        uses: actions/download-artifact@v4
        with:
          name: api-contract-check-${{ github.ref_name }}

      - name: Configure SSH
        run: |
          install -d -m 0700 ~/.ssh
          printf '%s\n' "${{ secrets.LIGHTSAIL_SSH_PRIVATE_KEY }}" > ~/.ssh/lightsail
          chmod 600 ~/.ssh/lightsail
          ssh-keyscan -H "${{ vars.LIGHTSAIL_HOST }}" >> ~/.ssh/known_hosts

      - name: Copy artifact to Lightsail
        run: |
          scp -i ~/.ssh/lightsail \
            "api-contract-check-${GITHUB_REF_NAME}.tar.gz" \
            "${{ vars.LIGHTSAIL_USER || 'ubuntu' }}@${{ vars.LIGHTSAIL_HOST }}:/tmp/"

      - name: Activate release on Lightsail
        run: |
          ssh -i ~/.ssh/lightsail \
            "${{ vars.LIGHTSAIL_USER || 'ubuntu' }}@${{ vars.LIGHTSAIL_HOST }}" \
            "RELEASE_VERSION='${GITHUB_REF_NAME}' bash -s" < scripts/deploy-lightsail-release.sh
