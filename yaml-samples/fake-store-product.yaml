# Matching request URL:
# https://fakestoreapi.com/products/1
openapi: 3.0.1
servers:
  - url: https://fakestoreapi.com
paths:
  /products/{id}:
    get:
      responses:
        '200':
          description: Store product details
          content:
            application/json:
              schema:
                type: object
                required: [ id, title, price, description, category, image, rating ]
                properties:
                  id:
                    type: integer
                  title:
                    type: string
                  price:
                    type: number
                  description:
                    type: string
                  category:
                    type: string
                  image:
                    type: string
                  rating:
                    type: object
                    required: [ rate, count ]
                    properties:
                      rate:
                        type: number
                      count:
                        type: integer
